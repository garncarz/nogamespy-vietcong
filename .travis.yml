language: python
python:
  - 3.7
services:
  - docker
install:
  - pip install coveralls
  - ./dev.sh build master
script:
  - ./dev.sh run master ./test.sh
after_success:
  - ls -la .coverage* || echo "No coverage files found"
  - test -f .coverage && coveralls || echo "Coverage file not found, skipping coveralls"
