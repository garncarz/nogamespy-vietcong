language: python
python:
  - 3.7
services:
  - docker
install:
  - pip install coveralls
  - ./dev.sh build master
script:
  # Create a temporary directory to hold coverage data
  - mkdir -p coverage_output
  # Run tests and copy coverage data to a mounted volume
  - ./dev.sh run -v $PWD/coverage_output:/coverage_output master bash -c "./test.sh && cp .coverage /coverage_output/ 2>/dev/null || echo 'No .coverage file to copy'"
  # Move coverage file to the current directory
  - test -f coverage_output/.coverage && mv coverage_output/.coverage . || echo "No coverage file found"
  # Clean up temporary directory
  - rm -rf coverage_output
after_success:
  - ls -la .coverage* || echo "No coverage files found"
  - test -f .coverage && coveralls || echo "No .coverage file found, skipping coveralls"
